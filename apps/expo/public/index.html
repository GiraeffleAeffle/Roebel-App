<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!--
      PWA head tags. This file — NOT app/+html.tsx — is the shell the web build
      actually ships: with `web.output: 'single'` the Expo CLI reads
      <publicFolder>/index.html as its template (see @expo/cli
      webTemplate.getTemplateIndexHtmlAsync) and only consults +html.tsx for
      static rendering. Without the manifest link below the browser offers no
      install prompt, so keep these tags here.
    -->
    <meta name="theme-color" content="#00498B" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Röbel" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Matches the app's background so the pre-hydration paint never flashes white. -->
    <style id="roebel-background">
      body {
        background-color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #18191B;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
