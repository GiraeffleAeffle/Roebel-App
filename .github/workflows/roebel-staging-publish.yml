name: Röbel staging OCI publisher

# Publication and promotion are deliberately separate modules. This workflow
# builds, verifies, publishes and attests only the affected secret-free
# staging images. It never updates a Release Set head, Flux source, Kubernetes
# object or cluster.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/agent-watcher/**"
      - "packages/miniapp-sdk/**"
      - "packages/nostr/**"
      - "packages/protocol/**"
      - "packages/publisher/**"
      - "packages/record-client/**"
      - "packages/stadtstack-federation-client/**"
      - "packages/workspace/**"
      - "Dockerfile.staging-web"
      - "Dockerfile.staging-web-runtime"
      - ".npmrc"
      - "package.json"
      - "patches/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/ci/build-staging-web-runtime.sh"
      - "scripts/ci/affected-staging-components.mjs"
      - "scripts/assemble-roebel-staging-release-set.mjs"
      - "scripts/verify-staging-*-oci.mjs"
      - ".github/workflows/roebel-staging-publish.yml"
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Exact same-repository source commit to publish (40 lowercase hexadecimal characters)"
        required: true
        type: string

permissions: {}

concurrency:
  group: roebel-staging-publisher-${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
  cancel-in-progress: false

env:
  WEB_IMAGE: ghcr.io/giraeffleaeffle/roebel-web-staging
  MECKY_IMAGE: ghcr.io/giraeffleaeffle/public-mecky
  MAX_CONTEXT_BYTES: "41943040"
  MAX_STORE_BYTES: "4294967296"
  MAX_DEPENDENCY_INSTALL_BYTES: "4294967296"
  MAX_RUNTIME_CONTEXT_BYTES: "805306368"

jobs:
  guard:
    name: Validate protected publication request
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Bind the request to protected main and an exact repository commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          actual="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION" --jq .sha)"
          test "$actual" = "$SOURCE_REVISION"
          ancestry="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_REVISION...main" --jq .status)"
          test "$ancestry" = identical || test "$ancestry" = ahead

  changes:
    name: Select affected publisher components
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      web: ${{ steps.detect.outputs.web }}
      public_mecky: ${{ steps.detect.outputs.public_mecky }}
      any_publish: ${{ steps.detect.outputs.any_publish }}
      publish_build_matrix: ${{ steps.detect.outputs.publish_build_matrix }}
    env:
      SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
      BASE_REVISION: ${{ github.event_name == 'push' && github.event.before || '' }}
    steps:
      - name: Check out the exact comparison range
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected publisher components
        id: detect
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          changed_paths="$RUNNER_TEMP/changed-paths"
          if [[ "$BASE_REVISION" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "$BASE_REVISION^{commit}" \
            && git cat-file -e "$SOURCE_REVISION^{commit}" \
            && git diff --name-only "$BASE_REVISION" "$SOURCE_REVISION" > "$changed_paths"; then
            test -s "$changed_paths" || printf '__all__\n' > "$changed_paths"
          else
            printf '__all__\n' > "$changed_paths"
          fi
          node scripts/ci/affected-staging-components.mjs --github-output < "$changed_paths"

  publish:
    name: Publish ${{ matrix.component }} by verified digest
    needs: [guard, changes]
    if: ${{ needs.changes.outputs.any_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: roebel-staging-publisher
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.publish_build_matrix) }}
    env:
      SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
      COMPONENT: ${{ matrix.component }}
      PACKAGE: ${{ matrix.package }}
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
          path: source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
          run_install: false

      - name: Bind runner-local evidence paths
        shell: bash
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          {
            printf 'ARCHIVE=%s/%s\n' "$RUNNER_TEMP" "$ARCHIVE_NAME"
            printf 'LAYOUT=%s/%s-oci\n' "$RUNNER_TEMP" "$COMPONENT"
            printf 'SOURCE_RECEIPT=%s/%s.source-receipt.json\n' "$RUNNER_TEMP" "$COMPONENT"
            printf 'SBOM=%s/%s.spdx.json\n' "$RUNNER_TEMP" "$COMPONENT"
            printf 'PUBLICATION_RECEIPT=%s/%s.publication-receipt.json\n' "$RUNNER_TEMP" "$COMPONENT"
          } >> "$GITHUB_ENV"

      - name: Prune to the exact component dependency graph
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx turbo@2.4.0 prune "$PACKAGE" --docker --out-dir "$RUNNER_TEMP/pruned"
          mkdir -p "$RUNNER_TEMP/context" "$RUNNER_TEMP/dependency-manifests"
          cp -a "$RUNNER_TEMP/pruned/full/." "$RUNNER_TEMP/context/"
          cp "$RUNNER_TEMP/pruned/pnpm-lock.yaml" "$RUNNER_TEMP/context/pnpm-lock.yaml"
          cp .npmrc "$RUNNER_TEMP/context/.npmrc"
          cp -a "$RUNNER_TEMP/pruned/json/." "$RUNNER_TEMP/dependency-manifests/"
          cp "$RUNNER_TEMP/pruned/pnpm-lock.yaml" "$RUNNER_TEMP/dependency-manifests/pnpm-lock.yaml"
          cp .npmrc "$RUNNER_TEMP/dependency-manifests/.npmrc"
          context_bytes="$(du -sb "$RUNNER_TEMP/context" | cut -f1)"
          dependency_manifest_bytes="$(du -sb "$RUNNER_TEMP/dependency-manifests" | cut -f1)"
          test "$context_bytes" -le "$MAX_CONTEXT_BYTES"
          test "$dependency_manifest_bytes" -le 2097152
          printf 'context_bytes=%s\n' "$context_bytes"
          printf 'dependency_manifest_bytes=%s\n' "$dependency_manifest_bytes"

      - name: Prepare exact offline package inputs
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corepack-cache" "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/fetch-input"
          cp -a "$RUNNER_TEMP/dependency-manifests/." "$RUNNER_TEMP/fetch-input/"
          COREPACK_HOME="$RUNNER_TEMP/corepack-cache" corepack prepare pnpm@9.15.0 --activate
          pnpm fetch --store-dir "$RUNNER_TEMP/pnpm-store" --dir "$RUNNER_TEMP/fetch-input"
          test -d "$RUNNER_TEMP/fetch-input/node_modules/.pnpm"
          test ! -e "$RUNNER_TEMP/context/node_modules"
          test ! -e "$RUNNER_TEMP/dependency-manifests/node_modules"
          store_bytes="$(du -sb "$RUNNER_TEMP/pnpm-store" | cut -f1)"
          test "$store_bytes" -le "$MAX_STORE_BYTES"
          printf 'store_bytes=%s\n' "$store_bytes"

      - name: Build the standalone Web runtime once
        if: ${{ matrix.component == 'roebel-web-staging' }}
        working-directory: source
        shell: bash
        env:
          SOURCE_CONTEXT: ${{ runner.temp }}/context
          PNPM_STORE: ${{ runner.temp }}/pnpm-store
          COREPACK_CACHE: ${{ runner.temp }}/corepack-cache
          RUNTIME_CONTEXT: ${{ runner.temp }}/web-runtime-context
        run: scripts/ci/build-staging-web-runtime.sh

      - name: Set up isolated Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host
          buildkitd-flags: --oci-worker-gc --oci-worker-gc-keepstorage 2147483648

      - name: Authenticate BuildKit to the exact GHCR namespace
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Package exactly one Web runtime-only linux/amd64 OCI archive
        if: ${{ matrix.component == 'roebel-web-staging' }}
        working-directory: source
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          MAX_ARTIFACT_BYTES: ${{ matrix.max_artifact_bytes }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_REVISION")"
          import_name="stadtstack.local/roebel-web-preview/roebel-web-staging:source-$SOURCE_REVISION"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --file "$GITHUB_WORKSPACE/source/$DOCKERFILE" \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --output "type=oci,dest=$ARCHIVE,name=$import_name,annotation.io.containerd.image.name=$import_name,rewrite-timestamp=true" \
            "$RUNNER_TEMP/web-runtime-context"
          artifact_bytes="$(stat -c %s "$ARCHIVE")"
          test "$artifact_bytes" -le "$MAX_ARTIFACT_BYTES"
          printf 'artifact_bytes=%s\n' "$artifact_bytes"

      - name: Build exactly one Public Mecky linux/amd64 OCI archive
        if: ${{ matrix.component == 'public-mecky' }}
        working-directory: source
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          MAX_ARTIFACT_BYTES: ${{ matrix.max_artifact_bytes }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_REVISION")"
          import_name="stadtstack.local/roebel-staging-lab/public-mecky:source-$SOURCE_REVISION"
          cache_ref="$IMAGE:buildcache-main"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --file "$GITHUB_WORKSPACE/source/$DOCKERFILE" \
            --build-context "corepack-cache=$RUNNER_TEMP/corepack-cache" \
            --build-context "pnpm-store=$RUNNER_TEMP/pnpm-store" \
            --build-context "dependency-manifests=$RUNNER_TEMP/dependency-manifests" \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --cache-from "type=registry,ref=$cache_ref" \
            --cache-to "type=registry,ref=$cache_ref,mode=min,oci-mediatypes=true,image-manifest=true" \
            --output "type=oci,dest=$ARCHIVE,name=$import_name,annotation.io.containerd.image.name=$import_name,rewrite-timestamp=true" \
            "$RUNNER_TEMP/context"
          artifact_bytes="$(stat -c %s "$ARCHIVE")"
          test "$artifact_bytes" -le "$MAX_ARTIFACT_BYTES"
          printf 'artifact_bytes=%s\n' "$artifact_bytes"

      - name: Verify source, runtime and secret-free OCI content
        id: verify
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$LAYOUT"
          tar -xf "$ARCHIVE" -C "$LAYOUT"
          case "$COMPONENT" in
            roebel-web-staging)
              node scripts/verify-staging-web-oci.mjs "$LAYOUT" "$SOURCE_REVISION" "$SOURCE_RECEIPT"
              ;;
            public-mecky)
              node scripts/verify-staging-service-oci.mjs "$LAYOUT" "$SOURCE_REVISION" public-mecky "$SOURCE_RECEIPT"
              ;;
            *) exit 1 ;;
          esac
          manifest_digest="$(jq -er .manifestDigest "$SOURCE_RECEIPT")"
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          archive_sha256="sha256:$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          source_receipt_sha256="sha256:$(sha256sum "$SOURCE_RECEIPT" | cut -d' ' -f1)"
          printf 'manifest_digest=%s\n' "$manifest_digest" >> "$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$archive_sha256" >> "$GITHUB_OUTPUT"
          printf 'source_receipt_sha256=%s\n' "$source_receipt_sha256" >> "$GITHUB_OUTPUT"

      - name: Set up pinned ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0

      - name: Authenticate to the exact GHCR namespace
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish once without overwriting a different source tag
        id: publish
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.verify.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          tag="source-$SOURCE_REVISION"
          target="$IMAGE:$tag"
          state=ERROR
          remote_digest=""
          for attempt in 1 2 3; do
            error_file="$RUNNER_TEMP/oras-resolve-$COMPONENT-$attempt.log"
            if remote_digest="$(oras resolve "$target" 2>"$error_file")"; then
              state=EXACT
              test "$remote_digest" = "$EXPECTED_DIGEST" || state=WRONG
              break
            fi
            if grep -Eqi '(not found|404|manifest unknown|name unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN)' "$error_file"; then
              state=ABSENT
              break
            fi
            test "$attempt" -lt 3
            sleep "$attempt"
          done
          case "$state" in
            EXACT) ;;
            ABSENT)
              oras cp --from-oci-layout "$LAYOUT:$tag" "$target"
              ;;
            WRONG)
              printf 'refusing to overwrite %s (%s != %s)\n' "$target" "$remote_digest" "$EXPECTED_DIGEST" >&2
              exit 1
              ;;
            *)
              printf 'unable to determine existing tag state for %s\n' "$target" >&2
              exit 1
              ;;
          esac
          published_digest="$(oras resolve "$target")"
          test "$published_digest" = "$EXPECTED_DIGEST"
          test "$(oras resolve "$IMAGE@$EXPECTED_DIGEST")" = "$EXPECTED_DIGEST"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'manifest_digest=%s\n' "$published_digest" >> "$GITHUB_OUTPUT"

      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.51.0

      - name: Generate and validate SPDX SBOM from the verified archive
        shell: bash
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          "$SYFT" "oci-archive:$ARCHIVE" -o "spdx-json=$SBOM"
          test "$(stat -c %s "$SBOM")" -le 16777216
          node --input-type=module - "$SBOM" <<'NODE'
          import { readFileSync } from "node:fs";
          const sbom = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (sbom.spdxVersion !== "SPDX-2.3") throw new Error("spdx_version_invalid");
          if (!Array.isArray(sbom.packages)) throw new Error("spdx_packages_invalid");
          NODE

      - name: Attach GitHub OIDC build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.manifest_digest }}
          push-to-registry: true

      - name: Attach SPDX SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.manifest_digest }}
          sbom-path: ${{ env.SBOM }}
          push-to-registry: true

      - name: Write deterministic non-secret publication receipt
        shell: bash
        env:
          MANIFEST_DIGEST: ${{ steps.publish.outputs.manifest_digest }}
          TAG: ${{ steps.publish.outputs.tag }}
          ARCHIVE_SHA256: ${{ steps.verify.outputs.archive_sha256 }}
          SOURCE_RECEIPT_SHA256: ${{ steps.verify.outputs.source_receipt_sha256 }}
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_ATTESTATION_ID: ${{ steps.sbom-attestation.outputs.attestation-id }}
          SBOM_ATTESTATION_URL: ${{ steps.sbom-attestation.outputs.attestation-url }}
        run: |
          set -euo pipefail
          sbom_sha256="sha256:$(sha256sum "$SBOM" | cut -d' ' -f1)"
          jq -n \
            --arg schemaVersion roebel_staging_publication_receipt_v1 \
            --arg component "$COMPONENT" \
            --arg sourceRevision "$SOURCE_REVISION" \
            --arg image "$IMAGE" \
            --arg tag "$TAG" \
            --arg manifestDigest "$MANIFEST_DIGEST" \
            --arg archiveSha256 "$ARCHIVE_SHA256" \
            --arg sourceReceiptSha256 "$SOURCE_RECEIPT_SHA256" \
            --arg sbomSha256 "$sbom_sha256" \
            --arg provenanceId "$PROVENANCE_ID" \
            --arg provenanceUrl "$PROVENANCE_URL" \
            --arg sbomAttestationId "$SBOM_ATTESTATION_ID" \
            --arg sbomAttestationUrl "$SBOM_ATTESTATION_URL" \
            --arg workflowIdentity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/roebel-staging-publish.yml@refs/heads/main" \
            --arg runId "$GITHUB_RUN_ID" \
            '{schemaVersion:$schemaVersion,component:$component,sourceRevision:$sourceRevision,image:$image,tag:$tag,manifestDigest:$manifestDigest,archiveSha256:$archiveSha256,sourceReceiptSha256:$sourceReceiptSha256,sbomSha256:$sbomSha256,provenance:{id:$provenanceId,url:$provenanceUrl},sbomAttestation:{id:$sbomAttestationId,url:$sbomAttestationUrl},workflowIdentity:$workflowIdentity,runId:$runId,civicAuthority:"none",deploymentEffect:false}' \
            > "$PUBLICATION_RECEIPT"
          jq -e '(.schemaVersion == "roebel_staging_publication_receipt_v1") and (.manifestDigest | test("^sha256:[0-9a-f]{64}$")) and (.deploymentEffect == false) and (.civicAuthority == "none")' "$PUBLICATION_RECEIPT" >/dev/null

      - name: Upload verification evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.component }}-publication-${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
          path: |
            ${{ env.SOURCE_RECEIPT }}
            ${{ env.SBOM }}
            ${{ env.PUBLICATION_RECEIPT }}
          if-no-files-found: error
          compression-level: 9
          retention-days: 30

  assemble-release-set:
    name: Assemble verified Release Set candidate
    needs: [publish, changes]
    if: ${{ needs.changes.outputs.any_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
      attestations: read
    env:
      SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
      AFFECTED_WEB: ${{ needs.changes.outputs.web }}
      AFFECTED_MECKY: ${{ needs.changes.outputs.public_mecky }}
      SIGNER_IDENTITY: https://github.com/GiraeffleAeffle/Roebel-App/.github/workflows/roebel-staging-publish.yml@refs/heads/main
      OPERATIONS_HEAD_URL: https://raw.githubusercontent.com/GiraeffleAeffle/roebel-staging-operations/main/reviewed-render/roebel-staging/head.json
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
          path: source
          persist-credentials: false

      - name: Download this run's exact publication evidence
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: "*-publication-${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}"
          path: publication
          merge-multiple: true

      - name: Bind the current public operations head once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-set
          curl --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --max-time 30 \
            "$OPERATIONS_HEAD_URL" \
            --output release-set/previous-head.json
          jq -e '
            .schemaVersion == "roebel_staging_release_set_head_v1" and
            (.promotionRevision | test("^[0-9a-f]{40}$")) and
            (.releaseSetDigest | test("^sha256:[0-9a-f]{64}$")) and
            (.components | length == 2)
          ' release-set/previous-head.json >/dev/null

      - name: Set up pinned ORAS for Release Set reuse
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0

      - name: Authenticate to the existing GHCR packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Verify receipts and signed attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-set/evidence release-set/bundles/provenance release-set/bundles/sbom
          test "$AFFECTED_WEB" = true || test "$AFFECTED_MECKY" = true

          verify_component() {
            component="$1"
            image="$2"
            source_receipt="publication/$component.source-receipt.json"
            publication_receipt="publication/$component.publication-receipt.json"
            sbom="publication/$component.spdx.json"
            test -f "$source_receipt"
            test -f "$publication_receipt"
            test -f "$sbom"
            manifest_digest="$(jq -er .manifestDigest "$publication_receipt")"
            [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$(jq -er .schemaVersion "$publication_receipt")" = roebel_staging_publication_receipt_v1
            test "$(jq -er .component "$publication_receipt")" = "$component"
            test "$(jq -er .sourceRevision "$publication_receipt")" = "$SOURCE_REVISION"
            test "$(jq -er .image "$publication_receipt")" = "$image"
            test "$(jq -er .tag "$publication_receipt")" = "source-$SOURCE_REVISION"
            test "$(jq -er .workflowIdentity "$publication_receipt")" = "$SIGNER_IDENTITY"
            test "$(jq -er .runId "$publication_receipt")" = "$GITHUB_RUN_ID"
            test "$(jq -er .civicAuthority "$publication_receipt")" = none
            test "$(jq -er .deploymentEffect "$publication_receipt")" = false
            test "$(jq -er .manifestDigest "$source_receipt")" = "$manifest_digest"
            test "$(jq -er .sourceRevision "$source_receipt")" = "$SOURCE_REVISION"
            test "$(jq -er .sourceReceiptSha256 "$publication_receipt")" = "sha256:$(sha256sum "$source_receipt" | cut -d' ' -f1)"
            test "$(jq -er .sbomSha256 "$publication_receipt")" = "sha256:$(sha256sum "$sbom" | cut -d' ' -f1)"
            test "$(jq -er .spdxVersion "$sbom")" = SPDX-2.3

            provenance_directory="release-set/bundles/provenance/$component"
            sbom_directory="release-set/bundles/sbom/$component"
            mkdir "$provenance_directory" "$sbom_directory"
            (
              cd "$provenance_directory"
              gh attestation download "oci://$image@$manifest_digest" \
                --repo "$GITHUB_REPOSITORY" \
                --predicate-type https://slsa.dev/provenance/v1
              test -s "${manifest_digest}.jsonl"
              mv -- "${manifest_digest}.jsonl" "sha256-${manifest_digest#sha256:}.jsonl"
            )
            (
              cd "$sbom_directory"
              gh attestation download "oci://$image@$manifest_digest" \
                --repo "$GITHUB_REPOSITORY" \
                --predicate-type https://spdx.dev/Document/v2.3
              test -s "${manifest_digest}.jsonl"
              mv -- "${manifest_digest}.jsonl" "sha256-${manifest_digest#sha256:}.jsonl"
            )
            bundle_name="sha256-${manifest_digest#sha256:}.jsonl"
            provenance_bundle="$provenance_directory/$bundle_name"
            sbom_bundle="$sbom_directory/$bundle_name"
            test -s "$provenance_bundle"
            test -s "$sbom_bundle"
            gh attestation verify "oci://$image@$manifest_digest" \
              --bundle "$provenance_bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$SIGNER_IDENTITY" \
              --source-digest "$SOURCE_REVISION" \
              --source-ref refs/heads/main \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners \
              --format json --jq 'length == 1' | grep -Fx true
            gh attestation verify "oci://$image@$manifest_digest" \
              --bundle "$sbom_bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$SIGNER_IDENTITY" \
              --source-digest "$SOURCE_REVISION" \
              --source-ref refs/heads/main \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --deny-self-hosted-runners \
              --format json --jq 'length == 1' | grep -Fx true

            jq -n \
              --arg schemaVersion roebel_staging_component_evidence_v1 \
              --arg component "$component" \
              --arg sourceRevision "$SOURCE_REVISION" \
              --arg manifestDigest "$manifest_digest" \
              --arg issuer https://token.actions.githubusercontent.com \
              --arg identity "$SIGNER_IDENTITY" \
              --arg predicateType https://slsa.dev/provenance/v1 \
              --arg attestationDigest "sha256:$(sha256sum "$provenance_bundle" | cut -d' ' -f1)" \
              --arg sbomDigest "sha256:$(sha256sum "$sbom" | cut -d' ' -f1)" \
              '{schemaVersion:$schemaVersion,component:$component,sourceRevision:$sourceRevision,manifestDigest:$manifestDigest,provenance:{issuer:$issuer,identity:$identity,predicateType:$predicateType,subjectDigest:$manifestDigest,attestationDigest:$attestationDigest},sbom:{format:"SPDX-2.3",identity:"https://spdx.dev/spdx/v2.3",subjectDigest:$manifestDigest,artifactDigest:$sbomDigest}}' \
              > "release-set/evidence/$component.component-evidence.json"
          }

          reuse_component() {
            component="$1"
            image="$2"
            source_revision="$(jq -er --arg component "$component" '.components[] | select(.component == $component) | .sourceRevision' release-set/previous-head.json)"
            manifest_digest="$(jq -er --arg component "$component" '.components[] | select(.component == $component) | .manifestDigest' release-set/previous-head.json)"
            [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]]
            [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$(oras resolve "$image@$manifest_digest")" = "$manifest_digest"

            previous_revision="$(jq -er .promotionRevision release-set/previous-head.json)"
            previous_digest="$(jq -er .releaseSetDigest release-set/previous-head.json)"
            release_set_target="$WEB_IMAGE:release-set-$previous_revision"
            release_set_digest="$(oras resolve "$release_set_target")"
            [[ "$release_set_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            reused_release_set_manifest="$RUNNER_TEMP/reused-release-set-manifest-$component.json"
            oras manifest fetch "$WEB_IMAGE@$release_set_digest" > "$reused_release_set_manifest"
            jq -e \
              --arg type application/vnd.stadtstack.roebel.release-set.v1 \
              --arg source "$previous_revision" \
              --arg candidate "$previous_digest" \
              '.artifactType == $type and .annotations["org.opencontainers.image.revision"] == $source and .annotations["stadtstack.io/candidate-payload-digest"] == $candidate' \
              "$reused_release_set_manifest" >/dev/null

            reused="$RUNNER_TEMP/reused-release-set-$component"
            mkdir "$reused"
            oras pull "$WEB_IMAGE@$release_set_digest" --output "$reused"
            test "$(find "$reused/release-set" -type f | wc -l | tr -d ' ')" = 8
            test "$(find "$reused/release-set" -type l | wc -l | tr -d ' ')" = 0
            test -s "$reused/release-set/release-set.candidate.json"
            jq -e \
              --arg source "$previous_revision" \
              --arg candidate "$previous_digest" \
              --slurpfile head release-set/previous-head.json \
              '.schemaVersion == "roebel_staging_release_set_candidate_v1" and
               .promotionRevision == $source and
               .candidatePayloadDigest == $candidate and
               ([.components[] | {component,sourceRevision,manifestDigest}] | sort_by(.component)) ==
               ([$head[0].components[] | {component,sourceRevision,manifestDigest}] | sort_by(.component))' \
              "$reused/release-set/release-set.candidate.json" >/dev/null
          node --input-type=module - "$reused/release-set/release-set.candidate.json" "$previous_digest" <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const [candidatePath, expectedDigest] = process.argv.slice(2);
          const candidate = JSON.parse(readFileSync(candidatePath, "utf8"));
          const { candidatePayloadDigest, ...payload } = candidate;
          const canonical = `${JSON.stringify(payload, null, 2)}\n`;
          const actual = `sha256:${createHash("sha256").update(canonical).digest("hex")}`;
          if (actual !== candidatePayloadDigest || actual !== expectedDigest) throw new Error("approved_release_set_digest_mismatch");
          NODE

            evidence="$reused/release-set/evidence/$component.component-evidence.json"
            provenance_bundle="$reused/release-set/bundles/provenance/$component/sha256-${manifest_digest#sha256:}.jsonl"
            sbom_bundle="$reused/release-set/bundles/sbom/$component/sha256-${manifest_digest#sha256:}.jsonl"
            test -s "$evidence"
            test -s "$provenance_bundle"
            test -s "$sbom_bundle"
            test "$(jq -er .schemaVersion "$evidence")" = roebel_staging_component_evidence_v1
            test "$(jq -er .component "$evidence")" = "$component"
            test "$(jq -er .sourceRevision "$evidence")" = "$source_revision"
            test "$(jq -er .manifestDigest "$evidence")" = "$manifest_digest"
            test "$(jq -er .provenance.subjectDigest "$evidence")" = "$manifest_digest"
            test "$(jq -er .sbom.subjectDigest "$evidence")" = "$manifest_digest"
            [[ "$(jq -er .provenance.attestationDigest "$evidence")" = "sha256:$(sha256sum "$provenance_bundle" | cut -d' ' -f1)" ]]
            [[ "$(jq -er .sbom.artifactDigest "$evidence")" =~ ^sha256:[0-9a-f]{64}$ ]]
            mkdir -p "release-set/bundles/provenance/$component" "release-set/bundles/sbom/$component"
            cp "$evidence" "release-set/evidence/$component.component-evidence.json"
            cp "$provenance_bundle" "release-set/bundles/provenance/$component/"
            cp "$sbom_bundle" "release-set/bundles/sbom/$component/"

            layout="$RUNNER_TEMP/reused-$component-oci"
            mkdir "$layout"
            oras cp "$image@$manifest_digest" --to-oci-layout "$layout:source-$source_revision"
            case "$component" in
              roebel-web-staging)
                node "$GITHUB_WORKSPACE/source/scripts/verify-staging-web-oci.mjs" "$layout" "$source_revision" "publication/$component.source-receipt.json"
                ;;
              public-mecky)
                node "$GITHUB_WORKSPACE/source/scripts/verify-staging-service-oci.mjs" "$layout" "$source_revision" public-mecky "publication/$component.source-receipt.json"
                ;;
              *) exit 1 ;;
            esac
            test "$(jq -er .manifestDigest "publication/$component.source-receipt.json")" = "$manifest_digest"
            test "$(jq -er .sourceRevision "publication/$component.source-receipt.json")" = "$source_revision"
            gh attestation verify "oci://$image@$manifest_digest" \
              --bundle "$provenance_bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$SIGNER_IDENTITY" \
              --source-digest "$source_revision" \
              --source-ref refs/heads/main \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners \
              --format json --jq 'length == 1' | grep -Fx true
            gh attestation verify "oci://$image@$manifest_digest" \
              --bundle "$sbom_bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$SIGNER_IDENTITY" \
              --source-digest "$source_revision" \
              --source-ref refs/heads/main \
              --predicate-type https://spdx.dev/Document/v2.3 \
              --deny-self-hosted-runners \
              --format json --jq 'length == 1' | grep -Fx true
          }

          verify_or_reuse_component() {
            affected="$1"
            component="$2"
            image="$3"
            if test "$affected" = true; then
              verify_component "$component" "$image"
            elif test "$affected" = false; then
              reuse_component "$component" "$image"
            else
              printf 'affected-component selection is invalid for %s\n' "$component" >&2
              exit 1
            fi
          }

          # Each component writes only to its own receipt, evidence, bundle and
          # OCI-layout paths. Both paths still complete their full immutable
          # verification before the CAS-bound candidate is assembled below.
          verify_or_reuse_component "$AFFECTED_WEB" roebel-web-staging "$WEB_IMAGE" &
          web_verification_pid=$!
          verify_or_reuse_component "$AFFECTED_MECKY" public-mecky "$MECKY_IMAGE" &
          mecky_verification_pid=$!

          web_verification_status=0
          mecky_verification_status=0
          wait "$web_verification_pid" || web_verification_status=$?
          wait "$mecky_verification_pid" || mecky_verification_status=$?
          test "$web_verification_status" -eq 0
          test "$mecky_verification_status" -eq 0

      - name: Assemble the CAS-bound candidate
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assemble-roebel-staging-release-set.mjs \
            "$SOURCE_REVISION" \
            "$GITHUB_WORKSPACE/publication/roebel-web-staging.source-receipt.json" \
            "$GITHUB_WORKSPACE/publication/public-mecky.source-receipt.json" \
            "$GITHUB_WORKSPACE/release-set/evidence/roebel-web-staging.component-evidence.json" \
            "$GITHUB_WORKSPACE/release-set/evidence/public-mecky.component-evidence.json" \
            "$GITHUB_WORKSPACE/release-set/previous-head.json" \
            "$GITHUB_WORKSPACE/release-set/release-set.candidate.json" \
            > "$RUNNER_TEMP/release-set-output.json"
          cmp "$RUNNER_TEMP/release-set-output.json" "$GITHUB_WORKSPACE/release-set/release-set.candidate.json"
          jq -e \
            --arg source "$SOURCE_REVISION" \
            --arg web "$AFFECTED_WEB" \
            --arg mecky "$AFFECTED_MECKY" \
            --slurpfile previous "$GITHUB_WORKSPACE/release-set/previous-head.json" '
            .schemaVersion == "roebel_staging_release_set_candidate_v1" and
            .promotionRevision == $source and
            (.candidatePayloadDigest | test("^sha256:[0-9a-f]{64}$")) and
            (.components | length == 2) and
            ((.components[] | select(.component == "roebel-web-staging") | .sourceRevision) ==
              (if $web == "true" then $source else ($previous[0].components[] | select(.component == "roebel-web-staging") | .sourceRevision) end)) and
            ((.components[] | select(.component == "public-mecky") | .sourceRevision) ==
              (if $mecky == "true" then $source else ($previous[0].components[] | select(.component == "public-mecky") | .sourceRevision) end)) and
            ((.components[] | select(.component == "roebel-web-staging") | .manifestDigest) ==
              (if $web == "true" then (.components[] | select(.component == "roebel-web-staging") | .manifestDigest) else ($previous[0].components[] | select(.component == "roebel-web-staging") | .manifestDigest) end)) and
            ((.components[] | select(.component == "public-mecky") | .manifestDigest) ==
              (if $mecky == "true" then (.components[] | select(.component == "public-mecky") | .manifestDigest) else ($previous[0].components[] | select(.component == "public-mecky") | .manifestDigest) end))
          ' "$GITHUB_WORKSPACE/release-set/release-set.candidate.json" >/dev/null

      - name: Publish the verified Release Set as an immutable OCI handoff
        id: publish-release-set
        shell: bash
        run: |
          set -euo pipefail
          tag="release-set-$SOURCE_REVISION"
          target="$WEB_IMAGE:$tag"
          artifact_type="application/vnd.stadtstack.roebel.release-set.v1"
          candidate="release-set/release-set.candidate.json"
          candidate_digest="$(jq -er .candidatePayloadDigest "$candidate")"
          [[ "$candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          state=ERROR
          for attempt in 1 2 3; do
            error_file="$RUNNER_TEMP/oras-release-set-resolve-$attempt.log"
            if existing_digest="$(oras resolve "$target" 2>"$error_file")"; then
              state=EXISTS
              break
            fi
            if grep -Eqi '(not found|404|manifest unknown|name unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN)' "$error_file"; then
              state=ABSENT
              break
            fi
            test "$attempt" -lt 3
            sleep "$attempt"
          done

          if test "$state" = EXISTS; then
            existing="$RUNNER_TEMP/existing-release-set"
            mkdir "$existing"
            oras pull "$target" --output "$existing"
            test "$(find "$existing/release-set" -type f | wc -l | tr -d ' ')" = 8
            test "$(find "$existing/release-set" -type l | wc -l | tr -d ' ')" = 0
            diff -r "$existing/release-set" release-set
          elif test "$state" = ABSENT; then
            mecky_manifest_hex="$(jq -er '.components[] | select(.component == "public-mecky") | .manifestDigest | sub("^sha256:"; "")' "$candidate")"
            web_manifest_hex="$(jq -er '.components[] | select(.component == "roebel-web-staging") | .manifestDigest | sub("^sha256:"; "")' "$candidate")"
            [[ "$mecky_manifest_hex" =~ ^[0-9a-f]{64}$ ]]
            [[ "$web_manifest_hex" =~ ^[0-9a-f]{64}$ ]]
            files=(
              "release-set/release-set.candidate.json:application/vnd.stadtstack.roebel.release-set.v1+json"
              "release-set/previous-head.json:application/json"
              "release-set/evidence/public-mecky.component-evidence.json:application/json"
              "release-set/evidence/roebel-web-staging.component-evidence.json:application/json"
              "release-set/bundles/provenance/public-mecky/sha256-$mecky_manifest_hex.jsonl:application/jsonl"
              "release-set/bundles/provenance/roebel-web-staging/sha256-$web_manifest_hex.jsonl:application/jsonl"
              "release-set/bundles/sbom/public-mecky/sha256-$mecky_manifest_hex.jsonl:application/jsonl"
              "release-set/bundles/sbom/roebel-web-staging/sha256-$web_manifest_hex.jsonl:application/jsonl"
            )
            test "${#files[@]}" = 8
            for entry in "${files[@]}"; do
              test -s "${entry%%:*}"
            done
            oras push "$target" \
              --artifact-type "$artifact_type" \
              --annotation "org.opencontainers.image.revision=$SOURCE_REVISION" \
              --annotation "stadtstack.io/candidate-payload-digest=$candidate_digest" \
              "${files[@]}"
          else
            printf 'unable to determine existing Release Set state for %s\n' "$target" >&2
            exit 1
          fi

          artifact_digest="$(oras resolve "$target")"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          oras manifest fetch "$WEB_IMAGE@$artifact_digest" > "$RUNNER_TEMP/release-set-manifest.json"
          jq -e \
            --arg type "$artifact_type" \
            --arg source "$SOURCE_REVISION" \
            --arg candidate "$candidate_digest" \
            '.artifactType == $type and .annotations["org.opencontainers.image.revision"] == $source and .annotations["stadtstack.io/candidate-payload-digest"] == $candidate' \
            "$RUNNER_TEMP/release-set-manifest.json" >/dev/null
          pulled="$RUNNER_TEMP/verified-release-set"
          mkdir "$pulled"
          oras pull "$WEB_IMAGE@$artifact_digest" --output "$pulled"
          test "$(find "$pulled/release-set" -type f | wc -l | tr -d ' ')" = 8
          test "$(find "$pulled/release-set" -type l | wc -l | tr -d ' ')" = 0
          diff -r "$pulled/release-set" release-set
          jq -n \
            --arg schemaVersion roebel_staging_release_set_publication_v1 \
            --arg sourceRevision "$SOURCE_REVISION" \
            --arg image "$WEB_IMAGE" \
            --arg tag "$tag" \
            --arg artifactType "$artifact_type" \
            --arg artifactDigest "$artifact_digest" \
            --arg candidatePayloadDigest "$candidate_digest" \
            '{schemaVersion:$schemaVersion,sourceRevision:$sourceRevision,image:$image,tag:$tag,artifactType:$artifactType,artifactDigest:$artifactDigest,candidatePayloadDigest:$candidatePayloadDigest,civicAuthority:"none",deploymentEffect:false}' \
            > release-set/release-set.publication.json
          printf 'artifact_digest=%s\n' "$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Upload the effect-free Release Set candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roebel-staging-release-set-${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
          path: |
            release-set/release-set.candidate.json
            release-set/release-set.publication.json
            release-set/previous-head.json
            release-set/evidence/*.component-evidence.json
            release-set/bundles/**/*.jsonl
            publication/*.source-receipt.json
            publication/*.publication-receipt.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
