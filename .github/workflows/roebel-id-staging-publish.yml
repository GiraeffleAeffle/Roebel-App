name: Röbel independent staging identity publisher

# Build one separate issuer image on explicit dispatch; never deploy it here.
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Exact same-repository source commit (40 lowercase hexadecimal characters)"
        required: true
        type: string

permissions: {}

concurrency:
  group: roebel-id-staging-publisher-${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
  cancel-in-progress: false

env:
  MAX_CONTEXT_BYTES: "31457280"
  MAX_STORE_BYTES: "2147483648"
  MAX_ARTIFACT_BYTES: "268435456"

jobs:
  guard:
    name: Bind an exact protected source revision
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify protected main ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION" --jq .sha)" = "$SOURCE_REVISION"
          ancestry="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_REVISION...main" --jq .status)"
          test "$ancestry" = identical || test "$ancestry" = ahead

  publish:
    name: Publish ${{ matrix.component }} by verified digest
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: roebel-staging-publisher
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: roebel-id-staging
            package: "@roebel/roebel-id"
            dockerfile: apps/roebel-id/Dockerfile.staging
            image: ghcr.io/giraeffleaeffle/roebel-id-staging
    env:
      SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
      COMPONENT: ${{ matrix.component }}
      PACKAGE: ${{ matrix.package }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Check out exactly the reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: source
          persist-credentials: false

      - name: Bind runner-local evidence paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'ARCHIVE=%s/%s.oci.tar\n' "$RUNNER_TEMP" "$COMPONENT"
            printf 'LAYOUT=%s/%s-oci\n' "$RUNNER_TEMP" "$COMPONENT"
            printf 'SOURCE_RECEIPT=%s/%s.source-receipt.json\n' "$RUNNER_TEMP" "$COMPONENT"
            printf 'SBOM=%s/%s.spdx.json\n' "$RUNNER_TEMP" "$COMPONENT"
            printf 'PUBLICATION_RECEIPT=%s/%s.publication-receipt.json\n' "$RUNNER_TEMP" "$COMPONENT"
          } >> "$GITHUB_ENV"

      - name: Set up Node and pnpm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
          run_install: false

      - name: Prune to exactly this runtime dependency graph
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          pnpm dlx turbo@2.4.0 prune "$PACKAGE" --docker --out-dir "$RUNNER_TEMP/pruned"
          mkdir -p "$RUNNER_TEMP/context" "$RUNNER_TEMP/dependency-manifests" "$RUNNER_TEMP/fetch-input"
          cp -a "$RUNNER_TEMP/pruned/full/." "$RUNNER_TEMP/context/"
          cp "$RUNNER_TEMP/pruned/pnpm-lock.yaml" "$RUNNER_TEMP/context/pnpm-lock.yaml"
          cp .npmrc "$RUNNER_TEMP/context/.npmrc"
          cp -a "$RUNNER_TEMP/pruned/json/." "$RUNNER_TEMP/dependency-manifests/"
          cp "$RUNNER_TEMP/pruned/pnpm-lock.yaml" "$RUNNER_TEMP/dependency-manifests/pnpm-lock.yaml"
          cp .npmrc "$RUNNER_TEMP/dependency-manifests/.npmrc"
          test "$(du -sb "$RUNNER_TEMP/context" | cut -f1)" -le "$MAX_CONTEXT_BYTES"
          cp -a "$RUNNER_TEMP/dependency-manifests/." "$RUNNER_TEMP/fetch-input/"

      - name: Prepare and test only the scoped runtime package
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corepack-cache" "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/test-context"
          COREPACK_HOME="$RUNNER_TEMP/corepack-cache" corepack prepare pnpm@9.15.0 --activate
          pnpm fetch --store-dir "$RUNNER_TEMP/pnpm-store" --dir "$RUNNER_TEMP/fetch-input"
          test "$(du -sb "$RUNNER_TEMP/pnpm-store" | cut -f1)" -le "$MAX_STORE_BYTES"
          cp -a "$RUNNER_TEMP/context/." "$RUNNER_TEMP/test-context/"
          pnpm --dir "$RUNNER_TEMP/test-context" --store-dir "$RUNNER_TEMP/pnpm-store" --offline install --frozen-lockfile --ignore-scripts
          pnpm --dir "$RUNNER_TEMP/test-context" --filter "$PACKAGE" test
          pnpm --dir "$RUNNER_TEMP/test-context" --filter "$PACKAGE" build
          test ! -e "$RUNNER_TEMP/context/node_modules"

      - name: Set up isolated Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host
          buildkitd-flags: --oci-worker-gc --oci-worker-gc-keepstorage 2147483648

      - name: Build one bounded linux/amd64 OCI archive
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_REVISION")"
          import_name="stadtstack.local/roebel-staging-lab/$COMPONENT:source-$SOURCE_REVISION"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            --file "$GITHUB_WORKSPACE/source/$DOCKERFILE" \
            --build-context "corepack-cache=$RUNNER_TEMP/corepack-cache" \
            --build-context "pnpm-store=$RUNNER_TEMP/pnpm-store" \
            --build-context "dependency-manifests=$RUNNER_TEMP/dependency-manifests" \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SOURCE_DATE_EPOCH=$source_date_epoch" \
            --output "type=oci,dest=$ARCHIVE,name=$import_name,annotation.io.containerd.image.name=$import_name,rewrite-timestamp=true" \
            "$RUNNER_TEMP/context"
          test "$(stat -c %s "$ARCHIVE")" -le "$MAX_ARTIFACT_BYTES"

      - name: Verify source-bound OCI content before publication
        id: verify
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$LAYOUT"
          tar -xf "$ARCHIVE" -C "$LAYOUT"
          node scripts/verify-staging-service-oci.mjs "$LAYOUT" "$SOURCE_REVISION" "$COMPONENT" "$SOURCE_RECEIPT"
          digest="$(jq -er .manifestDigest "$SOURCE_RECEIPT")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'manifest_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'source_receipt_sha256=sha256:%s\n' "$(sha256sum "$SOURCE_RECEIPT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Set up and authenticate pinned ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: CAS publish only the exact source tag
        id: publish
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.verify.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          target="$IMAGE:source-$SOURCE_REVISION"
          state=unknown
          remote_digest=""
          error_file="$RUNNER_TEMP/oras-resolve-$COMPONENT.log"
          if remote_digest="$(oras resolve "$target" 2>"$error_file")"; then state=present; elif grep -Eqi '(not found|404|manifest unknown|name unknown)' "$error_file"; then state=absent; else exit 1; fi
          if [ "$state" = absent ]; then oras cp --from-oci-layout "$LAYOUT:source-$SOURCE_REVISION" "$target"; else test "$remote_digest" = "$EXPECTED_DIGEST"; fi
          published_digest="$(oras resolve "$target")"
          test "$published_digest" = "$EXPECTED_DIGEST"
          test "$(oras resolve "$IMAGE@$EXPECTED_DIGEST")" = "$EXPECTED_DIGEST"
          printf 'manifest_digest=%s\n' "$published_digest" >> "$GITHUB_OUTPUT"

      - name: Generate a bounded SPDX SBOM
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.51.0
      - shell: bash
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          "$SYFT" "oci-archive:$ARCHIVE" -o "spdx-json=$SBOM"
          test "$(stat -c %s "$SBOM")" -le 16777216
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | type == "array")' "$SBOM" >/dev/null

      - name: Attach GitHub OIDC provenance and SBOM
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.manifest_digest }}
          push-to-registry: true
      - name: Attach SPDX SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.manifest_digest }}
          sbom-path: ${{ env.SBOM }}
          push-to-registry: true

      - name: Write a digest-only non-secret receipt
        shell: bash
        env:
          MANIFEST_DIGEST: ${{ steps.publish.outputs.manifest_digest }}
          SOURCE_RECEIPT_SHA256: ${{ steps.verify.outputs.source_receipt_sha256 }}
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_ID: ${{ steps.sbom-attestation.outputs.attestation-id }}
          SBOM_URL: ${{ steps.sbom-attestation.outputs.attestation-url }}
        run: |
          set -euo pipefail
          jq -n --arg component "$COMPONENT" --arg sourceRevision "$SOURCE_REVISION" --arg image "$IMAGE" --arg manifestDigest "$MANIFEST_DIGEST" --arg sourceReceiptSha256 "$SOURCE_RECEIPT_SHA256" --arg provenanceId "$PROVENANCE_ID" --arg provenanceUrl "$PROVENANCE_URL" --arg sbomId "$SBOM_ID" --arg sbomUrl "$SBOM_URL" --arg workflowIdentity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/roebel-id-staging-publish.yml@refs/heads/main" '{schemaVersion:"roebel_identity_publication_receipt_v1",component:$component,sourceRevision:$sourceRevision,image:$image,manifestDigest:$manifestDigest,sourceReceiptSha256:$sourceReceiptSha256,provenance:{id:$provenanceId,url:$provenanceUrl},sbomAttestation:{id:$sbomId,url:$sbomUrl},workflowIdentity:$workflowIdentity,civicAuthority:"none",deploymentEffect:false}' > "$PUBLICATION_RECEIPT"
          jq -e '(.manifestDigest | test("^sha256:[0-9a-f]{64}$")) and .deploymentEffect == false and .civicAuthority == "none"' "$PUBLICATION_RECEIPT" >/dev/null

      - name: Upload only verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.component }}-runtime-publication-${{ env.SOURCE_REVISION }}
          path: |
            ${{ env.SOURCE_RECEIPT }}
            ${{ env.SBOM }}
            ${{ env.PUBLICATION_RECEIPT }}
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
