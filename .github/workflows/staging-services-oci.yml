name: Röbel staging services OCI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/staging-services-oci.yml"
      - "packages/agent-watcher/**"
      - "packages/e2e-workbench/**"
      - "packages/nostr/**"
      - "packages/relay-sync/**"
      - "packages/staging-relay/**"
      - "packages/stadtstack-federation-client/**"
      - "patches/**"
      - "scripts/ci/**"
      - "scripts/verify-staging-service-oci.mjs"
      - "scripts/verify-staging-service-oci.test.mjs"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"

permissions:
  contents: read

concurrency:
  group: staging-services-oci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected staging services
    runs-on: ubuntu-latest
    outputs:
      any_service: ${{ steps.affected.outputs.any_service }}
      service_build_matrix: ${{ steps.affected.outputs.service_build_matrix }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected service boundaries
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            printf '__all__\n' > "$RUNNER_TEMP/changed-paths.txt"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          fi
          node scripts/ci/affected-staging-components.mjs --github-output < "$RUNNER_TEMP/changed-paths.txt"

  build:
    name: Build ${{ matrix.component }} private OCI artifact
    needs: changes
    if: ${{ needs.changes.outputs.any_service == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.service_build_matrix) }}
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      MAX_CONTEXT_BYTES: "31457280"
      MAX_STORE_BYTES: "2147483648"
      MAX_ARTIFACT_BYTES: "134217728"
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Prune to the exact service dependency graph
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          pnpm dlx turbo@2.4.0 prune "$PACKAGE" --docker --out-dir "$RUNNER_TEMP/pruned"
          mkdir -p "$RUNNER_TEMP/context" "$RUNNER_TEMP/dependency-manifests"
          cp -a "$RUNNER_TEMP/pruned/full/." "$RUNNER_TEMP/context/"
          cp "$RUNNER_TEMP/pruned/pnpm-lock.yaml" "$RUNNER_TEMP/context/pnpm-lock.yaml"
          cp .npmrc "$RUNNER_TEMP/context/.npmrc"
          cp -a "$RUNNER_TEMP/pruned/json/." "$RUNNER_TEMP/dependency-manifests/"
          cp "$RUNNER_TEMP/pruned/pnpm-lock.yaml" "$RUNNER_TEMP/dependency-manifests/pnpm-lock.yaml"
          cp .npmrc "$RUNNER_TEMP/dependency-manifests/.npmrc"
          context_bytes="$(du -sb "$RUNNER_TEMP/context" | cut -f1)"
          test "$context_bytes" -le "$MAX_CONTEXT_BYTES"
          printf 'context_bytes=%s\n' "$context_bytes"

      - name: Prepare exact offline package inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corepack-cache" "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/fetch-input"
          cp -a "$RUNNER_TEMP/dependency-manifests/." "$RUNNER_TEMP/fetch-input/"
          COREPACK_HOME="$RUNNER_TEMP/corepack-cache" corepack prepare pnpm@9.15.0 --activate
          pnpm fetch --store-dir "$RUNNER_TEMP/pnpm-store" --dir "$RUNNER_TEMP/fetch-input"
          test -d "$RUNNER_TEMP/fetch-input/node_modules/.pnpm"
          test ! -e "$RUNNER_TEMP/context/node_modules"
          test ! -e "$RUNNER_TEMP/dependency-manifests/node_modules"
          store_bytes="$(du -sb "$RUNNER_TEMP/pnpm-store" | cut -f1)"
          test "$store_bytes" -le "$MAX_STORE_BYTES"
          printf 'store_bytes=%s\n' "$store_bytes"

      - name: Run the scoped service tests
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-context"
          cp -a "$RUNNER_TEMP/context/." "$RUNNER_TEMP/test-context/"
          pnpm --dir "$RUNNER_TEMP/test-context" --store-dir "$RUNNER_TEMP/pnpm-store" --offline install --frozen-lockfile --ignore-scripts
          pnpm --dir "$RUNNER_TEMP/test-context" --filter "$PACKAGE" test
          pnpm --dir "$RUNNER_TEMP/test-context" --filter "$PACKAGE" typecheck
          test ! -e "$RUNNER_TEMP/context/node_modules"
          node --test scripts/verify-staging-service-oci.test.mjs

      - name: Set up isolated Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host
          buildkitd-flags: --oci-worker-gc --oci-worker-gc-keepstorage 2147483648

      - name: Build one linux/amd64 OCI archive
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_REVISION")"
          import_name="stadtstack.local/roebel-staging-lab/$COMPONENT:source-$SOURCE_REVISION"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --file "$DOCKERFILE" \
            --build-context "corepack-cache=$RUNNER_TEMP/corepack-cache" \
            --build-context "pnpm-store=$RUNNER_TEMP/pnpm-store" \
            --build-context "dependency-manifests=$RUNNER_TEMP/dependency-manifests" \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --output "type=oci,dest=/tmp/$COMPONENT.oci.tar,name=$import_name,annotation.io.containerd.image.name=$import_name,rewrite-timestamp=true" \
            "$RUNNER_TEMP/context"
          artifact_bytes="$(stat -c %s "/tmp/$COMPONENT.oci.tar")"
          test "$artifact_bytes" -le "$MAX_ARTIFACT_BYTES"
          printf 'artifact_bytes=%s\n' "$artifact_bytes"

      - name: Verify the content-addressed OCI result
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          mkdir "/tmp/$COMPONENT-oci"
          tar -xf "/tmp/$COMPONENT.oci.tar" -C "/tmp/$COMPONENT-oci"
          node scripts/verify-staging-service-oci.mjs \
            "/tmp/$COMPONENT-oci" \
            "$SOURCE_REVISION" \
            "$COMPONENT" \
            "/tmp/$COMPONENT.receipt.json"
          sha256sum "/tmp/$COMPONENT.oci.tar" > "/tmp/$COMPONENT.oci.tar.sha256"

      - name: Upload the private short-lived build result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-${{ env.SOURCE_REVISION }}
          path: |
            /tmp/${{ matrix.component }}.oci.tar
            /tmp/${{ matrix.component }}.oci.tar.sha256
            /tmp/${{ matrix.component }}.receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
