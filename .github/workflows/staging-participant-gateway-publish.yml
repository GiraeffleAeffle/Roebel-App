name: Röbel staging participant gateway

# This is a deliberately isolated, fast path for the staging-only participant
# gateway. Pull requests build and verify an OCI archive only. Main and an
# explicitly requested, main-ancestry commit publish one immutable image tag
# and its attestations; this workflow never changes GitOps or Kubernetes state.
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/staging-participant-gateway/**"
      - "packages/relay-sync/**"
      - "packages/nostr/**"
      - "patches/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/verify-staging-service-oci.mjs"
      - "scripts/verify-staging-service-oci.test.mjs"
      - "supabase/migrations/20260825_staging_participant_gateway.sql"
      - "supabase/staging_participant_gateway_deactivate.sql"
      - ".github/workflows/staging-participant-gateway-publish.yml"
  push:
    branches: [main]
    paths:
      - "packages/staging-participant-gateway/**"
      - "packages/relay-sync/**"
      - "packages/nostr/**"
      - "patches/**"
      - ".npmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "scripts/verify-staging-service-oci.mjs"
      - "scripts/verify-staging-service-oci.test.mjs"
      - "supabase/migrations/20260825_staging_participant_gateway.sql"
      - "supabase/staging_participant_gateway_deactivate.sql"
      - ".github/workflows/staging-participant-gateway-publish.yml"
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Exact same-repository main-ancestry commit to publish (40 lowercase hexadecimal characters)"
        required: true
        type: string

permissions: {}

concurrency:
  group: staging-participant-gateway-${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  COMPONENT: staging-participant-gateway
  PACKAGE: "@roebel/staging-participant-gateway"
  IMAGE: ghcr.io/giraeffleaeffle/roebel-staging-participant-gateway
  DOCKERFILE: packages/staging-participant-gateway/Dockerfile
  MAX_CONTEXT_BYTES: "31457280"
  MAX_STORE_BYTES: "2147483648"
  MAX_ARTIFACT_BYTES: "134217728"

jobs:
  guard:
    name: Bind exact protected source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify main ancestry for publication requests
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REVISION" --jq .sha)" = "$SOURCE_REVISION"
          ancestry="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_REVISION...main" --jq .status)"
          test "$ancestry" = identical || test "$ancestry" = ahead

  verify:
    name: Verify bounded gateway OCI
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exactly the requested source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node and pnpm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
          run_install: false

      - name: Prune only the gateway dependency graph
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          pnpm dlx turbo@2.4.0 prune "$PACKAGE" --docker --out-dir "$RUNNER_TEMP/pruned"
          mkdir -p "$RUNNER_TEMP/context" "$RUNNER_TEMP/dependency-manifests" "$RUNNER_TEMP/fetch-input"
          cp -a "$RUNNER_TEMP/pruned/full/." "$RUNNER_TEMP/context/"
          cp "$RUNNER_TEMP/pruned/pnpm-lock.yaml" "$RUNNER_TEMP/context/pnpm-lock.yaml"
          cp .npmrc "$RUNNER_TEMP/context/.npmrc"
          cp -a "$RUNNER_TEMP/pruned/json/." "$RUNNER_TEMP/dependency-manifests/"
          cp "$RUNNER_TEMP/pruned/pnpm-lock.yaml" "$RUNNER_TEMP/dependency-manifests/pnpm-lock.yaml"
          cp .npmrc "$RUNNER_TEMP/dependency-manifests/.npmrc"
          cp -a "$RUNNER_TEMP/dependency-manifests/." "$RUNNER_TEMP/fetch-input/"
          context_bytes="$(du -sb "$RUNNER_TEMP/context" | cut -f1)"
          manifest_bytes="$(du -sb "$RUNNER_TEMP/dependency-manifests" | cut -f1)"
          test "$context_bytes" -le "$MAX_CONTEXT_BYTES"
          test "$manifest_bytes" -le 2097152
          printf 'context_bytes=%s\nmanifest_bytes=%s\n' "$context_bytes" "$manifest_bytes"

      - name: Prepare offline inputs and run gateway tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corepack-cache" "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/test-context"
          COREPACK_HOME="$RUNNER_TEMP/corepack-cache" corepack prepare pnpm@9.15.0 --activate
          pnpm fetch --store-dir "$RUNNER_TEMP/pnpm-store" --dir "$RUNNER_TEMP/fetch-input"
          store_bytes="$(du -sb "$RUNNER_TEMP/pnpm-store" | cut -f1)"
          test "$store_bytes" -le "$MAX_STORE_BYTES"
          cp -a "$RUNNER_TEMP/context/." "$RUNNER_TEMP/test-context/"
          mkdir -p "$RUNNER_TEMP/test-context/supabase/migrations"
          cp supabase/migrations/20260825_staging_participant_gateway.sql \
            "$RUNNER_TEMP/test-context/supabase/migrations/"
          cp supabase/staging_participant_gateway_deactivate.sql \
            "$RUNNER_TEMP/test-context/supabase/"
          pnpm --dir "$RUNNER_TEMP/test-context" --store-dir "$RUNNER_TEMP/pnpm-store" --offline install --frozen-lockfile --ignore-scripts
          pnpm --dir "$RUNNER_TEMP/test-context" --filter "$PACKAGE" test
          pnpm --dir "$RUNNER_TEMP/test-context" --filter "$PACKAGE" typecheck
          test ! -e "$RUNNER_TEMP/context/node_modules"
          test ! -e "$RUNNER_TEMP/dependency-manifests/node_modules"

      - name: Set up isolated Buildx with a bounded cache
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host
          buildkitd-flags: --oci-worker-gc --oci-worker-gc-keepstorage 2147483648

      - name: Build one bounded linux/amd64 OCI archive
        working-directory: source
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/staging-participant-gateway.oci.tar
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_REVISION")"
          import_name="stadtstack.local/roebel-staging-lab/$COMPONENT:source-$SOURCE_REVISION"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            --file "$GITHUB_WORKSPACE/source/$DOCKERFILE" \
            --build-context "corepack-cache=$RUNNER_TEMP/corepack-cache" \
            --build-context "pnpm-store=$RUNNER_TEMP/pnpm-store" \
            --build-context "dependency-manifests=$RUNNER_TEMP/dependency-manifests" \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SOURCE_DATE_EPOCH=$source_date_epoch" \
            --output "type=oci,dest=$ARCHIVE,name=$import_name,annotation.io.containerd.image.name=$import_name,rewrite-timestamp=true" \
            "$RUNNER_TEMP/context"
          artifact_bytes="$(stat -c %s "$ARCHIVE")"
          test "$artifact_bytes" -le "$MAX_ARTIFACT_BYTES"
          printf 'artifact_bytes=%s\n' "$artifact_bytes"

      - name: Verify source-bound OCI content
        working-directory: source
        env:
          ARCHIVE: ${{ runner.temp }}/staging-participant-gateway.oci.tar
          LAYOUT: ${{ runner.temp }}/staging-participant-gateway-oci
          SOURCE_RECEIPT: ${{ runner.temp }}/staging-participant-gateway.source-receipt.json
        run: |
          set -euo pipefail
          mkdir "$LAYOUT"
          tar -xf "$ARCHIVE" -C "$LAYOUT"
          node scripts/verify-staging-service-oci.mjs "$LAYOUT" "$SOURCE_REVISION" "$COMPONENT" "$SOURCE_RECEIPT"

      - name: Upload the verified short-lived archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-participant-gateway-verify-${{ env.SOURCE_REVISION }}
          path: |
            ${{ runner.temp }}/staging-participant-gateway.oci.tar
            ${{ runner.temp }}/staging-participant-gateway.source-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish verified gateway digest
    needs: [guard, verify]
    if: ${{ github.event_name != 'pull_request' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: roebel-staging-publisher
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || github.sha }}
      ARCHIVE: publication-input/staging-participant-gateway.oci.tar
      SOURCE_RECEIPT: publication-input/staging-participant-gateway.source-receipt.json
      LAYOUT: ${{ runner.temp }}/staging-participant-gateway-oci
      SBOM: ${{ runner.temp }}/staging-participant-gateway.spdx.json
      PUBLICATION_RECEIPT: ${{ runner.temp }}/staging-participant-gateway.publication-receipt.json
    steps:
      - name: Check out the exact verifier source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact verified archive
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: staging-participant-gateway-verify-${{ env.SOURCE_REVISION }}
          path: publication-input

      - name: Re-verify the downloaded source-bound OCI
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ARCHIVE"
          test -f "$SOURCE_RECEIPT"
          mkdir "$LAYOUT"
          tar -xf "$ARCHIVE" -C "$LAYOUT"
          node source/scripts/verify-staging-service-oci.mjs "$LAYOUT" "$SOURCE_REVISION" "$COMPONENT" "$SOURCE_RECEIPT.reverified"
          cmp "$SOURCE_RECEIPT" "$SOURCE_RECEIPT.reverified"
          printf '%s  %s\n' "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" "$(basename "$ARCHIVE")" > publication-input/staging-participant-gateway.oci.tar.sha256
          test "$(sha256sum "$ARCHIVE" | cut -d' ' -f1)" = "$(cut -d' ' -f1 publication-input/staging-participant-gateway.oci.tar.sha256)"

      - name: Set up and authenticate pinned ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0
      - name: Authenticate to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish only the exact immutable source tag
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          expected_digest="$(jq -er .manifestDigest "$SOURCE_RECEIPT")"
          [[ "$expected_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          target="$IMAGE:source-$SOURCE_REVISION"
          error_file="$RUNNER_TEMP/oras-resolve.log"
          if remote_digest="$(oras resolve "$target" 2>"$error_file")"; then
            test "$remote_digest" = "$expected_digest"
          elif grep -Eqi '(not found|404|manifest unknown|name unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN)' "$error_file"; then
            oras cp --from-oci-layout "$LAYOUT@$expected_digest" "$target"
          else
            cat "$error_file" >&2
            exit 1
          fi
          published_digest="$(oras resolve "$target")"
          test "$published_digest" = "$expected_digest"
          test "$(oras resolve "$IMAGE@$expected_digest")" = "$expected_digest"
          printf 'manifest_digest=%s\n' "$published_digest" >> "$GITHUB_OUTPUT"

      - name: Install pinned Syft and generate SPDX SBOM
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.51.0
      - name: Validate bounded SBOM
        shell: bash
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          "$SYFT" "oci-archive:$ARCHIVE" -o "spdx-json=$SBOM"
          test "$(stat -c %s "$SBOM")" -le 16777216
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | type == "array")' "$SBOM" >/dev/null

      - name: Attach GitHub OIDC build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.manifest_digest }}
          push-to-registry: true

      - name: Attach SPDX SBOM attestation
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.manifest_digest }}
          sbom-path: ${{ env.SBOM }}
          push-to-registry: true

      - name: Write a digest-only publication receipt
        shell: bash
        env:
          MANIFEST_DIGEST: ${{ steps.publish.outputs.manifest_digest }}
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          SBOM_ATTESTATION_ID: ${{ steps.sbom-attestation.outputs.attestation-id }}
          SBOM_ATTESTATION_URL: ${{ steps.sbom-attestation.outputs.attestation-url }}
        run: |
          set -euo pipefail
          archive_sha256="sha256:$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          source_receipt_sha256="sha256:$(sha256sum "$SOURCE_RECEIPT" | cut -d' ' -f1)"
          sbom_sha256="sha256:$(sha256sum "$SBOM" | cut -d' ' -f1)"
          jq -n \
            --arg component "$COMPONENT" \
            --arg sourceRevision "$SOURCE_REVISION" \
            --arg image "$IMAGE" \
            --arg tag "source-$SOURCE_REVISION" \
            --arg manifestDigest "$MANIFEST_DIGEST" \
            --arg archiveSha256 "$archive_sha256" \
            --arg sourceReceiptSha256 "$source_receipt_sha256" \
            --arg sbomSha256 "$sbom_sha256" \
            --arg provenanceId "$PROVENANCE_ID" \
            --arg provenanceUrl "$PROVENANCE_URL" \
            --arg sbomAttestationId "$SBOM_ATTESTATION_ID" \
            --arg sbomAttestationUrl "$SBOM_ATTESTATION_URL" \
            --arg workflowIdentity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/staging-participant-gateway-publish.yml@refs/heads/main" \
            --arg runId "$GITHUB_RUN_ID" \
            '{schemaVersion:"roebel_staging_publication_receipt_v1",component:$component,sourceRevision:$sourceRevision,image:$image,tag:$tag,manifestDigest:$manifestDigest,archiveSha256:$archiveSha256,sourceReceiptSha256:$sourceReceiptSha256,sbomSha256:$sbomSha256,provenance:{id:$provenanceId,url:$provenanceUrl},sbomAttestation:{id:$sbomAttestationId,url:$sbomAttestationUrl},workflowIdentity:$workflowIdentity,runId:$runId,civicAuthority:"none",deploymentEffect:false}' \
            > "$PUBLICATION_RECEIPT"
          jq -e '.schemaVersion == "roebel_staging_publication_receipt_v1" and (.manifestDigest | test("^sha256:[0-9a-f]{64}$")) and .civicAuthority == "none" and .deploymentEffect == false' "$PUBLICATION_RECEIPT" >/dev/null

      - name: Upload digest-only publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-participant-gateway-publication-${{ env.SOURCE_REVISION }}
          path: |
            ${{ env.SOURCE_RECEIPT }}
            ${{ env.SBOM }}
            ${{ env.PUBLICATION_RECEIPT }}
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
