name: Regenerate reviewed upstream-sync pnpm lock

# This workflow creates review evidence only. It reconstructs the exact local
# merge candidate for one reviewed fork/upstream pair, regenerates the lockfile
# with lifecycle scripts disabled, and uploads the candidate lock plus checks.
# It does not commit, push, publish, deploy, access secrets, or receive writes.
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-upstream-pnpm-lock.yml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: reviewed-upstream-lock-regeneration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    # Fork pull requests never execute even this read-only dependency operation.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: Review-only lockfile regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # These are immutable, independently reviewed merge inputs. Changing one
      # requires a new workflow review rather than a runtime parameter.
      FORK_REVISION: 5b5fccd78ff197d5655600a39f1d24e5a752b736
      UPSTREAM_REVISION: 178419d5d291218f11d5e8383c9845171c9e126b
      MERGE_BASE: 3a26b43307cf5e72fd23d1c37ab665f3cc1c2ab1
      UPSTREAM_REPOSITORY: https://github.com/Roebel-Labs/Roebel-App.git
      NPM_CONFIG_IGNORE_SCRIPTS: "true"

    steps:
      - name: Check out the exact fork revision without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ env.FORK_REVISION }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the reviewed Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Fetch and bind the exact upstream revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FORK_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$UPSTREAM_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$FORK_REVISION"
          git remote add reviewed-upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags reviewed-upstream refs/heads/main:refs/remotes/reviewed-upstream/main
          test "$(git rev-parse reviewed-upstream/main)" = "$UPSTREAM_REVISION"
          test "$(git merge-base HEAD reviewed-upstream/main)" = "$MERGE_BASE"

      - name: Reconstruct only the reviewed source merge
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name "Röbel reviewed merge verifier"
          git config --local user.email "reviewed-merge-verifier@users.noreply.github.com"
          git merge --no-commit --no-ff reviewed-upstream/main || true
          test -f "$(git rev-parse --git-path MERGE_HEAD)"
          expected_conflicts=$'apps/expo/app/explore.tsx\ndocs/kickoffs/2026-08-11_K1_NETIZEN_ACCOUNTS_REPLACES_THIRDWEB.md\ndocs/kickoffs/2026-08-11_K3_IDENTITY_INVERSION.md\ndocs/kickoffs/README.md\npnpm-lock.yaml'
          actual_conflicts="$(git diff --name-only --diff-filter=U | LC_ALL=C sort)"
          test "$actual_conflicts" = "$expected_conflicts"

          # K1/K3 and their index retain the fork's accepted ADR 0014 staging
          # decision addenda; upstream's common kickoff body is otherwise the
          # same. The verified upstream Explore revision already includes the
          # compatible web-only flex sizing alongside its native motion work.
          git checkout --ours \
            docs/kickoffs/2026-08-11_K1_NETIZEN_ACCOUNTS_REPLACES_THIRDWEB.md \
            docs/kickoffs/2026-08-11_K3_IDENTITY_INVERSION.md \
            docs/kickoffs/README.md
          git checkout --theirs apps/expo/app/explore.tsx
          git add \
            apps/expo/app/explore.tsx \
            docs/kickoffs/2026-08-11_K1_NETIZEN_ACCOUNTS_REPLACES_THIRDWEB.md \
            docs/kickoffs/2026-08-11_K3_IDENTITY_INVERSION.md \
            docs/kickoffs/README.md
          test "$(git diff --name-only --diff-filter=U)" = "pnpm-lock.yaml"
          ! grep -REn '^(<<<<<<<|=======|>>>>>>>)' apps/expo/app/explore.tsx docs/kickoffs
          grep -Fq 'style={styles.scrollView}' apps/expo/app/explore.tsx

      - name: Regenerate the lockfile with pinned pnpm and no lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          export COREPACK_HOME="$RUNNER_TEMP/corepack"
          export PNPM_HOME="$RUNNER_TEMP/pnpm-home"
          export PNPM_STORE_DIR="$RUNNER_TEMP/pnpm-store"
          mkdir -p "$COREPACK_HOME" "$PNPM_HOME" "$PNPM_STORE_DIR" evidence
          corepack prepare pnpm@9.15.0 --activate
          test "$(corepack pnpm --version)" = "9.15.0"
          # The upstream lock is only a temporary structurally valid baseline;
          # pnpm derives the final result from the merged manifests.
          git checkout --theirs pnpm-lock.yaml
          corepack pnpm install --lockfile-only --ignore-scripts --store-dir "$PNPM_STORE_DIR"
          corepack pnpm install --frozen-lockfile --ignore-scripts --store-dir "$PNPM_STORE_DIR"
          git diff --check
          ! grep -En '^(<<<<<<<|=======|>>>>>>>)' pnpm-lock.yaml
          cp pnpm-lock.yaml evidence/pnpm-lock.yaml
          git diff --no-index -- \
            <(git show "$FORK_REVISION:pnpm-lock.yaml") \
            pnpm-lock.yaml > evidence/pnpm-lock.diff || test "$?" = 1
          sha256sum evidence/pnpm-lock.yaml evidence/pnpm-lock.diff > evidence/SHA256SUMS
          {
            printf 'fork_revision=%s\n' "$FORK_REVISION"
            printf 'upstream_revision=%s\n' "$UPSTREAM_REVISION"
            printf 'merge_base=%s\n' "$MERGE_BASE"
            printf 'pnpm_version=%s\n' "$(corepack pnpm --version)"
            printf 'lifecycle_scripts=disabled\n'
            printf 'deployment_effect=false\n'
            printf 'civic_authority=none\n'
          } > evidence/receipt.txt

      - name: Upload only lockfile review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-upstream-pnpm-lock-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
