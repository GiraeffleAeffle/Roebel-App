name: Security review

# Two-part security boundary:
#   1. pr-review    — a fast deterministic credential/RLS check on every
#                     same-repo PR, plus an optional AI review.
#   2. weekly-audit — an optional scheduled full-repo AI sweep.
#
# Optional repo secrets:
#   CLAUDE_API_KEY    — PR AI security review.
#   ANTHROPIC_API_KEY — weekly AI audit.
# Their absence must never turn the deterministic PR boundary red.
#
# Prompt-injection note: fork PRs do NOT receive secrets, so pr-review is
# guarded to same-repo PRs only. Review external contributions manually or
# re-run via workflow_dispatch after a maintainer has eyeballed the diff.

on:
  pull_request:
  schedule:
    # Mondays 06:00 UTC — weekly full-repo sweep.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Deterministic credential and RLS boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --test scripts/review-pr-security-boundary.test.mjs
          node scripts/review-pr-security-boundary.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Explain unavailable AI security review
        if: env.CLAUDE_API_KEY == ''
        run: echo "::notice::CLAUDE_API_KEY is unavailable; skipping the optional AI security review."

      - name: Optional AI security review
        if: env.CLAUDE_API_KEY != ''
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          comment-pr: true
          claude-api-key: ${{ env.CLAUDE_API_KEY }}
          # Single line to bump for a model upgrade (e.g. a future model):
          claude-model: claude-opus-4-8
          # Skip vendored / generated paths to save tokens and noise.
          exclude-directories: "node_modules,.next,dist,ios,android,pnpm-lock.yaml"

  weekly-audit:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Explain unavailable weekly AI audit
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY is unavailable; skipping the optional weekly AI audit."

      - name: Full-repo security sweep
        if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@3f854a8fb5146b39d5cbf8b57f70d80810e1366f # v1.0.198
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          model: claude-opus-4-8
          allowed_tools: "Bash(gh issue:*),Bash(git log:*),Read,Grep,Glob"
          prompt: |
            You are the scheduled security agent for the public AGPL-licensed
            Roebel civic-tech monorepo (Next.js web, Expo mobile, Supabase,
            Base L2 Solidity governance contracts).

            Audit the repository for security issues with a bias toward the
            things that matter most here:
              - Hardcoded secrets / API keys (Stripe, Supabase service-role,
                Anthropic, Irys, EXPO tokens) committed anywhere in the tree.
              - Supabase Row-Level-Security gaps or service-role key leaking to
                client code.
              - Auth / wallet handling flaws in the web and Expo apps.
              - Solidity access-control or governance bugs in contracts/.
              - Dangerous dependencies or scripts.

            Use `gh issue list --label security-audit` first. If you find one or
            more real, high-confidence issues, create a single GitHub issue
            titled "Weekly security audit — <date>" labelled `security-audit`
            summarising findings with file:line references and severity. If you
            find nothing material, do NOT open an issue — print "clean" and stop.
            Be precise; avoid false positives.
