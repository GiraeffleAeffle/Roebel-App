name: Röbel staging web OCI

on:
  workflow_call:
    inputs:
      source_revision:
        description: Exact source revision to build and verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact source revision; defaults to the dispatched revision
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-web-oci-${{ inputs.source_revision || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build one verified private OCI artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REVISION: ${{ inputs.source_revision || github.sha }}
      MAX_CONTEXT_BYTES: "41943040"
      MAX_STORE_BYTES: "4294967296"
      MAX_DEPENDENCY_INSTALL_BYTES: "4294967296"
      MAX_RUNTIME_CONTEXT_BYTES: "805306368"
      MAX_ARTIFACT_BYTES: "167772160"
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false

      - name: Verify the exact source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
          run_install: false

      - name: Prune the monorepo to the web dependency graph
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx turbo@2.4.0 prune @roebel/web --docker --out-dir "$RUNNER_TEMP/pruned"
          mkdir -p "$RUNNER_TEMP/context" "$RUNNER_TEMP/dependency-manifests"
          cp -a "$RUNNER_TEMP/pruned/full/." "$RUNNER_TEMP/context/"
          cp "$RUNNER_TEMP/pruned/pnpm-lock.yaml" "$RUNNER_TEMP/context/pnpm-lock.yaml"
          cp .npmrc "$RUNNER_TEMP/context/.npmrc"
          cp -a "$RUNNER_TEMP/pruned/json/." "$RUNNER_TEMP/dependency-manifests/"
          cp "$RUNNER_TEMP/pruned/pnpm-lock.yaml" "$RUNNER_TEMP/dependency-manifests/pnpm-lock.yaml"
          cp .npmrc "$RUNNER_TEMP/dependency-manifests/.npmrc"
          context_bytes="$(du -sb "$RUNNER_TEMP/context" | cut -f1)"
          test "$context_bytes" -le "$MAX_CONTEXT_BYTES"
          printf 'context_bytes=%s\n' "$context_bytes"

      - name: Guard the exact-head PR compiler cache destination
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          WEB_APP_PATH: ${{ runner.temp }}/context/apps/web
          NEXT_BUILD_PATH: ${{ runner.temp }}/context/apps/web/.next
          NEXT_CACHE_ROOT: ${{ runner.temp }}/context/apps/web/.next/cache
        run: |
          set -euo pipefail
          [[ "$PR_HEAD_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_REVISION" = "$PR_HEAD_REVISION"
          [[ -d "$WEB_APP_PATH" && ! -L "$WEB_APP_PATH" ]]
          [[ ! -e "$NEXT_BUILD_PATH" && ! -L "$NEXT_BUILD_PATH" ]]
          mkdir -p "$NEXT_CACHE_ROOT/webpack"
          [[ -d "$NEXT_CACHE_ROOT" && ! -L "$NEXT_CACHE_ROOT" ]]
          [[ -d "$NEXT_CACHE_ROOT/webpack" && ! -L "$NEXT_CACHE_ROOT/webpack" ]]
          test -z "$(find "$NEXT_CACHE_ROOT" -type l -print -quit)"

      - name: Restore the exact-head PR server compiler cache
        id: next-cache-restore
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/context/apps/web/.next/cache/webpack/server-production
            ${{ runner.temp }}/context/apps/web/.next/cache/webpack/edge-server-production
          key: roebel-web-pr-webpack-server-v1-${{ runner.os }}-${{ runner.arch }}-node22-pnpm9.15.0-head-${{ github.event.pull_request.head.sha }}

      - name: Validate the exact-head PR server compiler cache
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.next-cache-restore.outputs.cache-hit }}
          MAX_SELECTED_CACHE_BYTES: "2147483648"
          NEXT_CACHE_ROOT: ${{ runner.temp }}/context/apps/web/.next/cache
        run: |
          set -euo pipefail
          export LC_ALL=C
          server_cache="$NEXT_CACHE_ROOT/webpack/server-production"
          edge_cache="$NEXT_CACHE_ROOT/webpack/edge-server-production"
          [[ -d "$NEXT_CACHE_ROOT" && ! -L "$NEXT_CACHE_ROOT" ]]
          [[ -d "$NEXT_CACHE_ROOT/webpack" && ! -L "$NEXT_CACHE_ROOT/webpack" ]]
          test -z "$(find "$NEXT_CACHE_ROOT" -type l -print -quit)"
          test -z "$(find "$NEXT_CACHE_ROOT" ! -type d ! -type f -print -quit)"
          test -z "$(find "$NEXT_CACHE_ROOT" -mindepth 1 -maxdepth 1 ! -path "$NEXT_CACHE_ROOT/webpack" -print -quit)"
          test -z "$(find "$NEXT_CACHE_ROOT/webpack" -mindepth 1 -maxdepth 1 ! -path "$server_cache" ! -path "$edge_cache" -print -quit)"

          selected_apparent_bytes=0
          selected_allocated_bytes=0
          selected_files=0
          case "$CACHE_HIT" in
            true)
              normalized_hit=true
              for directory in "$server_cache" "$edge_cache"; do
                [[ -d "$directory" && ! -L "$directory" ]]
                directory_apparent_bytes="$(du -sb -- "$directory" | cut -f1)"
                directory_allocated_bytes="$(du -sB1 -- "$directory" | cut -f1)"
                directory_files="$(find "$directory" -type f -print0 | tr -cd '\000' | wc -c | tr -d '[:space:]')"
                [[ "$directory_apparent_bytes" =~ ^[0-9]+$ ]]
                [[ "$directory_allocated_bytes" =~ ^[0-9]+$ ]]
                [[ "$directory_files" =~ ^[0-9]+$ ]]
                (( directory_apparent_bytes < MAX_SELECTED_CACHE_BYTES ))
                (( directory_allocated_bytes < MAX_SELECTED_CACHE_BYTES ))
                selected_apparent_bytes="$((selected_apparent_bytes + directory_apparent_bytes))"
                selected_allocated_bytes="$((selected_allocated_bytes + directory_allocated_bytes))"
                selected_files="$((selected_files + directory_files))"
              done
              (( selected_apparent_bytes < MAX_SELECTED_CACHE_BYTES ))
              (( selected_allocated_bytes < MAX_SELECTED_CACHE_BYTES ))
              ;;
            ''|false)
              normalized_hit=false
              [[ ! -e "$server_cache" && ! -L "$server_cache" ]]
              [[ ! -e "$edge_cache" && ! -L "$edge_cache" ]]
              ;;
            *) exit 1 ;;
          esac
          printf 'next_cache_restore_v1 hit=%s apparent_bytes=%s allocated_bytes=%s files=%s key_scope=exact-pr-head selection=webpack/server-production,webpack/edge-server-production\n' \
            "$normalized_hit" "$selected_apparent_bytes" "$selected_allocated_bytes" "$selected_files"

      - name: Prepare the exact offline package inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/corepack-cache" "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/fetch-input"
          cp -a "$RUNNER_TEMP/dependency-manifests/." "$RUNNER_TEMP/fetch-input/"
          COREPACK_HOME="$RUNNER_TEMP/corepack-cache" corepack prepare pnpm@9.15.0 --activate
          pnpm fetch --store-dir "$RUNNER_TEMP/pnpm-store" --dir "$RUNNER_TEMP/fetch-input"
          test -d "$RUNNER_TEMP/fetch-input/node_modules/.pnpm"
          test ! -e "$RUNNER_TEMP/context/node_modules"
          test ! -e "$RUNNER_TEMP/dependency-manifests/node_modules"
          store_bytes="$(du -sb "$RUNNER_TEMP/pnpm-store" | cut -f1)"
          test "$store_bytes" -le "$MAX_STORE_BYTES"
          printf 'store_bytes=%s\n' "$store_bytes"

      - name: Build the standalone Web runtime once
        shell: bash
        env:
          SOURCE_CONTEXT: ${{ runner.temp }}/context
          PNPM_STORE: ${{ runner.temp }}/pnpm-store
          COREPACK_CACHE: ${{ runner.temp }}/corepack-cache
          RUNTIME_CONTEXT: ${{ runner.temp }}/web-runtime-context
        run: scripts/ci/build-staging-web-runtime.sh

      - name: Measure PR-only Web compiler cache candidates
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          NEXT_CACHE_PATH: ${{ runner.temp }}/context/apps/web/.next/cache
          NEXT_CACHE_ARCHIVE: ${{ runner.temp }}/next-cache-diagnostic.tar.zst
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ -d "$NEXT_CACHE_PATH" && ! -L "$NEXT_CACHE_PATH" ]]
          test -z "$(find "$NEXT_CACHE_PATH" -type l -print -quit)"
          [[ ! -e "$NEXT_CACHE_ARCHIVE" && ! -L "$NEXT_CACHE_ARCHIVE" ]]
          trap 'rm -f -- "$NEXT_CACHE_ARCHIVE"' EXIT

          report_directory() {
            local directory="$1"
            local relative_path="$2"
            local apparent_bytes allocated_bytes file_count
            apparent_bytes="$(du -sb -- "$directory" | cut -f1)"
            allocated_bytes="$(du -sB1 -- "$directory" | cut -f1)"
            file_count="$(find "$directory" -type f -print0 | tr -cd '\000' | wc -c | tr -d '[:space:]')"
            [[ "$apparent_bytes" =~ ^[0-9]+$ ]]
            [[ "$allocated_bytes" =~ ^[0-9]+$ ]]
            [[ "$file_count" =~ ^[0-9]+$ ]]
            printf 'next_cache_directory_v1 path=%q apparent_bytes=%s allocated_bytes=%s files=%s\n' \
              "$relative_path" "$apparent_bytes" "$allocated_bytes" "$file_count"
          }

          report_directory "$NEXT_CACHE_PATH" .
          shopt -s nullglob dotglob
          for directory in "$NEXT_CACHE_PATH"/*; do
            [[ -d "$directory" ]] || continue
            report_directory "$directory" "${directory#"$NEXT_CACHE_PATH"/}"
          done
          if [[ -d "$NEXT_CACHE_PATH/webpack" ]]; then
            for directory in "$NEXT_CACHE_PATH"/webpack/*; do
              [[ -d "$directory" ]] || continue
              report_directory "$directory" "${directory#"$NEXT_CACHE_PATH"/}"
            done
          fi

          compression_started="$(date +%s)"
          tar --zstd -cf "$NEXT_CACHE_ARCHIVE" \
            -C "$(dirname -- "$NEXT_CACHE_PATH")" \
            "$(basename -- "$NEXT_CACHE_PATH")"
          compression_finished="$(date +%s)"
          compressed_bytes="$(stat -c %s "$NEXT_CACHE_ARCHIVE")"
          [[ "$compressed_bytes" =~ ^[0-9]+$ ]]
          compression_elapsed_seconds="$((compression_finished - compression_started))"
          printf 'next_cache_compression_v1 compressed_bytes=%s elapsed_seconds=%s\n' \
            "$compressed_bytes" "$compression_elapsed_seconds"

          rm -f -- "$NEXT_CACHE_ARCHIVE"
          [[ ! -e "$NEXT_CACHE_ARCHIVE" && ! -L "$NEXT_CACHE_ARCHIVE" ]]
          trap - EXIT
          printf 'next_cache_diagnostic_v1 archive_deleted=true upload=false save=false\n'

      - name: Guard and measure the selected PR server compiler cache
        id: next-cache-selection
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASELINE_SELECTED_APPARENT_BYTES: "1688883560"
          MAX_SELECTED_CACHE_BYTES: "2147483648"
          NEXT_CACHE_ROOT: ${{ runner.temp }}/context/apps/web/.next/cache
          SELECTED_CACHE_ARCHIVE: ${{ runner.temp }}/next-cache-selected-diagnostic.tar.zst
        run: |
          set -euo pipefail
          export LC_ALL=C
          server_cache="$NEXT_CACHE_ROOT/webpack/server-production"
          edge_cache="$NEXT_CACHE_ROOT/webpack/edge-server-production"
          [[ -d "$NEXT_CACHE_ROOT" && ! -L "$NEXT_CACHE_ROOT" ]]
          test -z "$(find "$NEXT_CACHE_ROOT" -type l -print -quit)"
          test -z "$(find "$NEXT_CACHE_ROOT" ! -type d ! -type f -print -quit)"
          [[ ! -e "$SELECTED_CACHE_ARCHIVE" && ! -L "$SELECTED_CACHE_ARCHIVE" ]]
          trap 'rm -f -- "$SELECTED_CACHE_ARCHIVE"' EXIT

          selected_apparent_bytes=0
          selected_allocated_bytes=0
          selected_files=0
          for directory in "$server_cache" "$edge_cache"; do
            [[ -d "$directory" && ! -L "$directory" ]]
            directory_apparent_bytes="$(du -sb -- "$directory" | cut -f1)"
            directory_allocated_bytes="$(du -sB1 -- "$directory" | cut -f1)"
            directory_files="$(find "$directory" -type f -print0 | tr -cd '\000' | wc -c | tr -d '[:space:]')"
            [[ "$directory_apparent_bytes" =~ ^[0-9]+$ ]]
            [[ "$directory_allocated_bytes" =~ ^[0-9]+$ ]]
            [[ "$directory_files" =~ ^[0-9]+$ ]]
            (( directory_apparent_bytes < MAX_SELECTED_CACHE_BYTES ))
            (( directory_allocated_bytes < MAX_SELECTED_CACHE_BYTES ))
            selected_apparent_bytes="$((selected_apparent_bytes + directory_apparent_bytes))"
            selected_allocated_bytes="$((selected_allocated_bytes + directory_allocated_bytes))"
            selected_files="$((selected_files + directory_files))"
          done
          (( selected_apparent_bytes < MAX_SELECTED_CACHE_BYTES ))
          (( selected_allocated_bytes < MAX_SELECTED_CACHE_BYTES ))

          compression_started="$(date +%s)"
          tar --zstd -cf "$SELECTED_CACHE_ARCHIVE" \
            -C "$NEXT_CACHE_ROOT" \
            webpack/server-production \
            webpack/edge-server-production
          compression_finished="$(date +%s)"
          selected_compressed_bytes="$(stat -c %s "$SELECTED_CACHE_ARCHIVE")"
          [[ "$selected_compressed_bytes" =~ ^[0-9]+$ ]]
          (( selected_compressed_bytes < MAX_SELECTED_CACHE_BYTES ))
          compression_elapsed_seconds="$((compression_finished - compression_started))"
          printf 'next_cache_selected_v1 apparent_bytes=%s allocated_bytes=%s files=%s compressed_bytes=%s elapsed_seconds=%s baseline_apparent_bytes=%s limit_bytes=%s selection=webpack/server-production,webpack/edge-server-production\n' \
            "$selected_apparent_bytes" "$selected_allocated_bytes" "$selected_files" \
            "$selected_compressed_bytes" "$compression_elapsed_seconds" \
            "$BASELINE_SELECTED_APPARENT_BYTES" "$MAX_SELECTED_CACHE_BYTES"

          rm -f -- "$SELECTED_CACHE_ARCHIVE"
          [[ ! -e "$SELECTED_CACHE_ARCHIVE" && ! -L "$SELECTED_CACHE_ARCHIVE" ]]
          trap - EXIT
          printf 'save_allowed=true\n' >> "$GITHUB_OUTPUT"

      - name: Set up isolated Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host
          buildkitd-flags: --oci-worker-gc --oci-worker-gc-keepstorage 2147483648

      - name: Build one linux/amd64 OCI archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_REVISION")"
          import_name="stadtstack.local/roebel-web-preview/roebel-web-staging:source-$SOURCE_REVISION"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --file Dockerfile.staging-web-runtime \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --output "type=oci,dest=/tmp/roebel-web-staging.oci.tar,name=$import_name,annotation.io.containerd.image.name=$import_name,rewrite-timestamp=true" \
            "$RUNNER_TEMP/web-runtime-context"
          artifact_bytes="$(stat -c %s /tmp/roebel-web-staging.oci.tar)"
          test "$artifact_bytes" -le "$MAX_ARTIFACT_BYTES"
          printf 'artifact_bytes=%s\n' "$artifact_bytes"

      - name: Verify the content-addressed OCI result
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/roebel-web-staging-oci
          tar -xf /tmp/roebel-web-staging.oci.tar -C /tmp/roebel-web-staging-oci
          node scripts/verify-staging-web-oci.mjs \
            /tmp/roebel-web-staging-oci \
            "$SOURCE_REVISION" \
            /tmp/roebel-web-staging.receipt.json
          sha256sum /tmp/roebel-web-staging.oci.tar > /tmp/roebel-web-staging.oci.tar.sha256

      - name: Save the exact-head PR server compiler cache
        id: next-cache-save
        if: ${{ success() && github.event_name == 'pull_request' && steps.next-cache-restore.outputs.cache-hit != 'true' && steps.next-cache-selection.outputs.save_allowed == 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/context/apps/web/.next/cache/webpack/server-production
            ${{ runner.temp }}/context/apps/web/.next/cache/webpack/edge-server-production
          key: roebel-web-pr-webpack-server-v1-${{ runner.os }}-${{ runner.arch }}-node22-pnpm9.15.0-head-${{ github.event.pull_request.head.sha }}

      - name: Log the exact-head PR server compiler cache decision
        if: ${{ success() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          CACHE_HIT: ${{ steps.next-cache-restore.outputs.cache-hit }}
          SAVE_OUTCOME: ${{ steps.next-cache-save.outcome }}
        run: |
          set -euo pipefail
          case "$CACHE_HIT" in
            true)
              normalized_hit=true
              save_attempted=false
              test "$SAVE_OUTCOME" = skipped
              ;;
            ''|false)
              normalized_hit=false
              save_attempted=true
              test "$SAVE_OUTCOME" = success
              ;;
            *) exit 1 ;;
          esac
          printf 'next_cache_save_v1 restore_hit=%s attempted=%s outcome=%s key_scope=exact-pr-head\n' \
            "$normalized_hit" "$save_attempted" "$SAVE_OUTCOME"

      - name: Upload the private short-lived build result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: roebel-web-staging-${{ env.SOURCE_REVISION }}
          path: |
            /tmp/roebel-web-staging.oci.tar
            /tmp/roebel-web-staging.oci.tar.sha256
            /tmp/roebel-web-staging.receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
