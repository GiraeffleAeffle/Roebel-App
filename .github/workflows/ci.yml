name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected staging components
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.affected.outputs.web }}
      quality_required: ${{ steps.affected.outputs.quality_required }}
      quality_full: ${{ steps.affected.outputs.quality_full }}
      quality_web_tests: ${{ steps.affected.outputs.quality_web_tests }}
      quality_packages: ${{ steps.affected.outputs.quality_packages }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected image boundaries
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            printf '__all__\n' > "$RUNNER_TEMP/changed-paths.txt"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          fi
          node scripts/ci/affected-staging-components.mjs --github-output < "$RUNNER_TEMP/changed-paths.txt"

  quality:
    name: Affected quality and non-Web builds
    needs: changes
    if: ${{ needs.changes.outputs.quality_required == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the affected-quality boundary
        run: >-
          node --test
          .github/workflows/ci-single-web-build.static.test.mjs
          scripts/ci/affected-staging-components.test.mjs
          scripts/ci/run-affected-quality.test.mjs
          scripts/ci/write-staging-web-build-evidence.test.mjs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test, lint, typecheck and build the affected graph
        env:
          QUALITY_FULL: ${{ needs.changes.outputs.quality_full }}
          QUALITY_PACKAGES: ${{ needs.changes.outputs.quality_packages }}
          QUALITY_WEB_TESTS: ${{ needs.changes.outputs.quality_web_tests }}
        run: node scripts/ci/run-affected-quality.mjs

  web-oci:
    name: Verified Web build
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/staging-web-oci.yml
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - changes
      - quality
      - web-oci
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and the verified Web build
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          QUALITY_REQUIRED: ${{ needs.changes.outputs.quality_required }}
          WEB_OCI_RESULT: ${{ needs.web-oci.result }}
          WEB_REQUIRED: ${{ needs.changes.outputs.web }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          if test "$QUALITY_REQUIRED" = true; then
            test "$QUALITY_RESULT" = success
          else
            test "$QUALITY_REQUIRED" = false
            test "$QUALITY_RESULT" = skipped
          fi
          if test "$WEB_REQUIRED" = true; then
            test "$WEB_OCI_RESULT" = success
          else
            test "$WEB_REQUIRED" = false
            test "$WEB_OCI_RESULT" = skipped
          fi
