name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and non-Web builds
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Web unit tests
        run: pnpm test:web

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build non-Web packages
        # The reusable Web OCI job below performs the one authoritative Next
        # build for this revision. Keep every other package build in CI.
        run: pnpm exec turbo build --filter='!@roebel/web'

  web-oci:
    name: Verified Web build
    permissions:
      contents: read
    uses: ./.github/workflows/staging-web-oci.yml
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}

  ci:
    name: ci
    if: ${{ always() }}
    needs:
      - quality
      - web-oci
    runs-on: ubuntu-latest
    steps:
      - name: Require quality and the verified Web build
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          WEB_OCI_RESULT: ${{ needs.web-oci.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          test "$WEB_OCI_RESULT" = success
